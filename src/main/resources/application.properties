spring.application.name=movie-catalog-api

logging.level.com.moviecatalog=INFO

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moviecatalog}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.auth.username=${AUTH_USERNAME}
app.auth.password=${AUTH_PASSWORD}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiration-ms=3600000