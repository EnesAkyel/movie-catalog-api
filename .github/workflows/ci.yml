name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: ./mvnw package -DskipTests -q

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/movie-catalog-api-*.jar
          retention-days: 1

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 1

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Java Test Results
          path: "target/surefire-reports/*.xml,target/failsafe-reports/*.xml"
          reporter: java-junit

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download JaCoCo report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Download surefire reports
        uses: actions/download-artifact@v8
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Compile and analyse with SonarCloud
        run: ./mvnw package -DskipTests sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  api-tests:
    name: API Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7

      - name: Start movie-catalog-api
        uses: ./.github/actions/start-api
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Checkout api-testing-ts
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/api-testing-ts
          path: api-testing-ts

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api-testing-ts/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: api-testing-ts

      - name: Smoke tests
        run: npm run test:smoke
        working-directory: api-testing-ts
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Contract tests
        run: npm run test:contract
        working-directory: api-testing-ts
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Integration tests
        run: npm run test:integration
        working-directory: api-testing-ts
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: api-testing-ts/reports/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: API Test Results
          path: api-testing-ts/reports/*-junit.xml
          reporter: jest-junit

  k6:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Start movie-catalog-api
        uses: ./.github/actions/start-api
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Checkout k6-performance-tests
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/k6-performance-tests
          path: k6-performance-tests

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: k6-performance-tests/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: k6-performance-tests

      - name: Build TypeScript
        run: npm run build
        working-directory: k6-performance-tests

      - name: Install k6
        run: |
          K6_VERSION=$(curl --proto '=https' --tlsv1.2 -sf https://api.github.com/repos/grafana/k6/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl --proto '=https' --tlsv1.2 -L "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Run smoke test
        run: k6 run dist/smoke.js -e BASE_URL=http://localhost:8080 -e AUTH_USERNAME="$AUTH_USERNAME" -e AUTH_PASSWORD="$AUTH_PASSWORD" --summary-export=summary.json
        working-directory: k6-performance-tests
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-report
          path: k6-performance-tests/summary.json
          retention-days: 30

  gatling:
    name: Gatling Simulations
    runs-on: ubuntu-latest
    needs: build
    #if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Start movie-catalog-api
        uses: ./.github/actions/start-api
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Checkout gatling-performance-tests
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/gatling-performance-tests
          path: gatling-performance-tests

      - name: Run Gatling simulation
        run: mvn gatling:test -Dsimulation=simulations.BasicSimulation
        working-directory: gatling-performance-tests
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report
          path: gatling-performance-tests/target/gatling/
          retention-days: 30